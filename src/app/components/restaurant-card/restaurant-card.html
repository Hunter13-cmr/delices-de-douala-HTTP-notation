<div class="card">

    <img
    [src]="restaurant().image"
    [alt]="restaurant().name"
    loading="lazy"
    (error)="onImageError($event)">
    
    <div class="content">

        <h2>{{restaurant().name}}</h2>

        <p class="district"><app-icon name="location"></app-icon> {{restaurant().district}}</p>

        <p class="specialty"><app-icon name="cutlery"></app-icon> {{restaurant().specialty}}</p>

        <app-star-rating

            [currentRating]="restaurant().currentRating || 0"

            (ratingChanged)="onRatingChanged($event)"

        />

        <a [routerLink]="['/restaurant', restaurant().id]" class="view-menu-btn">
          Voir le menu →
        </a>

    </div>

</div>
